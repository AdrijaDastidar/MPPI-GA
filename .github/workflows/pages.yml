name: CI and Deploy Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test_lint_unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MPPI-GA

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start telemetry
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## CI Telemetry (Pages Pipeline)
          | Field | Value |
          | --- | --- |
          EOF

          echo "| Event | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MPPI-GA/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test:unit

      - name: Test telemetry
        if: always()
        run: |
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests executed" >> "$GITHUB_STEP_SUMMARY"

      - name: Job duration
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - $START_TIME))

          echo "## Duration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job took ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"

  sonar_scan:
    needs: test_lint_unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MPPI-GA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          SONAR_TOKEN: 8c513d4da8819410b0293fd83eb95c7dbf219224
        with:
          projectBaseDir: MPPI-GA
          args: >
            -Dsonar.projectKey=AdrijaDastidar_MPPI-GA
            -Dsonar.organization=adrijadastidar
            -Dsonar.host.url=https://sonarcloud.io

      - name: Sonar telemetry
        if: always()
        run: |
          echo "## SonarCloud Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: AdrijaDastidar_MPPI-GA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Org: Adrija" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: Completed" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [test_lint_unit, sonar_scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MPPI-GA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MPPI-GA/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build telemetry
        run: |
          echo "## Build Info" >> "$GITHUB_STEP_SUMMARY"

          if [ -d "MPPI-GA/dist" ]; then
            SIZE=$(du -sh MPPI-GA/dist | cut -f1)
            echo "- Build size: $SIZE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Build directory not found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: MPPI-GA/dist

      - name: Upload dist for integration tests
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: MPPI-GA/dist

  test_integration:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MPPI-GA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MPPI-GA/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: MPPI-GA/dist

      - name: Integration tests
        run: npm run test:integration

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test_integration]

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4